<html lang="ja">
<head>

<title>カラーローラー</title>

<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#faf4e6;--bd:#f1e6cb;--card:#fffdf8;--ink:#5a3b27;--sub:#9a8068;--cookie:#a8744a;--tile:#ffffff;--line:#eadfc8;--ball:#ff4d6d;--c:40px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2019;--bd:#21170f;--card:#382b21;--ink:#f6e9d3;--sub:#bda78a;--cookie:#b98557;--tile:#52402f;--line:#5c4838}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bgimg,var(--bg));color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none;user-select:none;overflow:hidden}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#hud{width:min(92vw,520px);display:flex;align-items:center;gap:14px}
#stage{font-size:26px;font-weight:800;letter-spacing:.02em}
#moves{font-size:14px;color:var(--sub);margin-left:auto}
#bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
#fill{height:100%;width:0;background:var(--ball);border-radius:6px;transition:width .15s}
#wrap{background:var(--bd);padding:14px;border-radius:28px;box-shadow:0 6px 0 var(--line),0 14px 30px rgba(90,59,39,.12)}
#board{position:relative}
#cv{display:block}
#ball{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:2;will-change:transform}
#ball i{position:absolute;inset:10%;border-radius:50%;transition:transform .1s;background:radial-gradient(circle at 34% 30%,#fff 0 10%,transparent 24%),var(--ballbg,var(--ball));box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 max(1.5px,calc(var(--c)*.07)) #fff}
#ball i.sq{animation:sq .26s}
#ball i.nope{animation:nope .2s}
@keyframes sq{0%{transform:scale(var(--sx,1.25),var(--sy,.75))}45%{transform:scale(calc(2 - var(--sx,1.25)),calc(2 - var(--sy,.75)))}100%{transform:scale(1)}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#hint{font-size:13px;color:var(--sub);height:18px;text-align:center}
#btns{display:flex;gap:10px}
button{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background:var(--card);border:0;border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 var(--line);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(60,35,20,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.panel{background:var(--card);border-radius:24px;padding:22px;width:min(92vw,420px);max-height:84vh;overflow-y:auto;touch-action:pan-y;text-align:center;box-shadow:0 8px 0 var(--line)}
.panel h2{margin:0 0 6px;font-size:26px}

#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
#grid button{padding:8px 0;display:flex;flex-direction:column;align-items:center;line-height:1.25}#grid small{font-size:10px;color:#f2a900;letter-spacing:1px}#grid button.cur small{color:#fff}#sTot{font-size:14px;color:var(--sub);font-weight:700}

:root[data-theme="dark"]{--grid:rgba(255,235,205,.05)}
:root[data-theme="mint"]{--bg:#e9f5ee;--bd:#d6ecde;--card:#f7fffa;--ink:#2e5a47;--sub:#7fa18f;--cookie:#9b7650;--tile:#fff;--line:#cfe6d7}
:root[data-theme="sakura"]{--bg:#fdf0f2;--bd:#f8dfe4;--card:#fff9fa;--ink:#7a3b4c;--sub:#c08a98;--cookie:#b27a62;--tile:#fff;--line:#f3d3da}
:root[data-theme="sky"]{--bg:#eaf3fb;--bd:#d8e9f7;--card:#f8fcff;--ink:#2f4a68;--sub:#7f9ab5;--cookie:#a07c58;--tile:#fff;--line:#cfe1f2}
:root[data-theme="lemon"]{--bg:#fbf6d8;--bd:#f4ecb4;--card:#fffdee;--ink:#6b5a1e;--sub:#b0a15a;--cookie:#a77d4b;--tile:#fff;--line:#ece3a8}

:root[data-theme="sunset"]{--bgimg:linear-gradient(160deg,#ffd9a8,#ff9fb0 55%,#b08cff);--bg:#ffc2b0;--bd:rgba(255,255,255,.4);--card:#fff7f2;--ink:#6a3a40;--sub:#b07a80;--cookie:#c0805a;--tile:#fff;--line:#f3d0cc}
:root[data-theme="ocean"]{--bgimg:linear-gradient(160deg,#d4f5ff,#8fd3f4 50%,#84a7ff);--bg:#a8dcf5;--bd:rgba(255,255,255,.4);--card:#f6fcff;--ink:#1f4166;--sub:#6f93b5;--cookie:#a07c58;--tile:#fff;--line:#c6e3f3}
:root[data-theme="aurora"]{--bgimg:linear-gradient(160deg,#10243f,#1f4b6e 45%,#3b2f6b);--bg:#1f3a5c;--bd:rgba(8,18,38,.45);--card:#1b3350;--ink:#e6f6ff;--sub:#8fb6d4;--cookie:#7fa6c4;--tile:#2d4c6e;--line:#30506f;--grid:rgba(255,255,255,.06)}
:root[data-theme="candy"]{--bgimg:linear-gradient(160deg,#ffe3f1,#e6dcff 50%,#d2f1ff);--bg:#efdcf5;--bd:rgba(255,255,255,.5);--card:#fffafd;--ink:#6a4a86;--sub:#a88fc0;--cookie:#b58a7a;--tile:#fff;--line:#eadcf3}
#ball i.mv{transition:transform .05s;box-shadow:0 0 0 max(1.5px,calc(var(--c)*.05)) #fff}
#ball::after{content:"";position:absolute;pointer-events:none;opacity:0;border-radius:99px;z-index:-1}
#ball[data-mv]::after{opacity:1}
#ball[data-mv="0"]::after{left:40%;width:20%;top:50%;height:calc(var(--c)*var(--tn,1.6));background:linear-gradient(180deg,rgba(255,255,255,.22),transparent)}
#ball[data-mv="1"]::after{left:40%;width:20%;bottom:50%;height:calc(var(--c)*var(--tn,1.6));background:linear-gradient(0deg,rgba(255,255,255,.22),transparent)}

#ball[data-mv="3"]::after{top:40%;height:20%;right:50%;width:calc(var(--c)*var(--tn,1.6));background:linear-gradient(270deg,rgba(255,255,255,.22),transparent)}
.wd{position:absolute;z-index:1;pointer-events:none;border-radius:3px;opacity:0;animation:wd .4s ease-out forwards}
@keyframes wd{0%{opacity:.6;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--wx,0),var(--wy,0))}}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
:root[data-theme="gold"]{--bgimg:linear-gradient(160deg,#fff4c2,#f3c94b 55%,#b9851a);--bg:#f3c94b;--bd:rgba(255,255,255,.35);--card:#fffaf0;--ink:#5c3d06;--sub:#6e4e0e;--cookie:#8a5a14;--tile:#fffdf4;--line:#f0d98a}
:root[data-theme="space"]{--bgimg:radial-gradient(ellipse at 30% 20%,#2b1e5e,#0a0d2a 60%,#03040f);--bg:#0a0d2a;--bd:rgba(8,12,38,.5);--card:#181b46;--ink:#eef0ff;--sub:#a9b0ea;--cookie:#7a83e0;--tile:#262a62;--line:#343a80;--grid:rgba(255,255,255,.06)}

:root[data-theme="snow"]{--bgimg:linear-gradient(180deg,#8fb8ec,#cfe3fb);--bg:#a8c9f2;--bd:rgba(255,255,255,.5);--card:#fbfdff;--ink:#2f4a68;--sub:#40628a;--cookie:#7d9bc0;--tile:#fff;--line:#d6e6f7}
.sw{position:absolute;z-index:1;border-radius:50%;pointer-events:none;opacity:0;background:#fff;box-shadow:0 0 0 1.5px rgba(90,59,39,.12);animation:sw .45s cubic-bezier(.2,.7,.3,1) forwards}
.ck2{display:flex;align-items:center;gap:12px}.ck2 .ck{margin:10px 0;min-width:84px}.ck2 input[type=range]{flex:1}
.seg button.th{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:0 0 0 2px var(--line)}.seg button.th.on{box-shadow:0 0 0 3px var(--ink)}
#ball:not([data-sh="0"]){filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 2px rgba(0,0,0,.28))}

#ball[data-sh="4"] i{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#ball[data-sh="5"] i{border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
#ball[data-pt="1"] i{background:radial-gradient(circle at 34% 30%,#fff 0 10%,transparent 24%),repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 4px,transparent 4px 9px),var(--ballbg,var(--ball))}
#ball[data-pt="2"] i{background:radial-gradient(circle at 34% 30%,#fff 0 10%,transparent 24%),radial-gradient(rgba(255,255,255,.55) 0 18%,transparent 20%) 0 0/34% 34%,var(--ballbg,var(--ball))}
#ball[data-pt="3"] i{background:radial-gradient(circle at 34% 30%,#fff 0 10%,transparent 24%),conic-gradient(rgba(255,255,255,.32) 25%,transparent 0 50%,rgba(255,255,255,.32) 0 75%,transparent 0) 0 0/40% 40%,var(--ballbg,var(--ball))}
#ball[data-pt="4"] i{background:radial-gradient(circle at 34% 30%,#fff 0 10%,transparent 24%),repeating-radial-gradient(circle,rgba(255,255,255,.4) 0 3px,transparent 3px 8px),var(--ballbg,var(--ball))}
@keyframes sw{0%{opacity:var(--o,.8);transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,-10px)) scale(.3)}}
.st label{display:block;text-align:left;font-weight:700;font-size:14px;margin:12px 0}.st input[type=range]{width:100%;accent-color:var(--ball)}.st .row{text-align:left;font-weight:700;font-size:14px;margin:16px 0 6px}.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{padding:7px 12px;font-size:13px}.seg button.on{background:var(--ink);color:var(--bg)}.seg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px var(--line)}.st .ck{display:flex;align-items:center;gap:10px;margin:10px 0}.st .ck input{width:20px;height:20px;accent-color:var(--ball)}
#top{width:min(92vw,520px);display:flex;align-items:center;gap:8px}#title{font-weight:800;font-size:15px;color:var(--sub);margin-right:auto}#tot{font-weight:800;font-size:14px;background:var(--card);padding:7px 12px;border-radius:12px;box-shadow:0 2px 0 var(--line)}.ic{padding:8px 11px}
#chips{display:flex;gap:8px;font-size:12px;color:var(--sub);font-weight:700}#chips span{background:var(--card);padding:4px 10px;border-radius:10px;box-shadow:0 2px 0 var(--line)}#cInfo{color:var(--sub);font-size:14px;margin:0 0 14px}
#grid button.cur{background:var(--ball);color:#fff}
#grid button:disabled{opacity:.35;box-shadow:none}
.big{background:var(--ink);color:var(--bg);padding:12px 26px;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app">
  <div id="top"><div id="title"></div><div id="tot">★ 0</div><button class="ic" id="bSet" aria-label="設定">⚙️</button></div><div id="hud"><div id="stage">1</div><div id="bar"><div id="fill"></div></div><div id="moves"></div></div>

</div>
<div class="ov" id="ovClear"><div class="panel"><h2 id="cTitle">クリア！</h2><div id="stars"></div><button class="big" id="bNext">次のステージへ</button> <button id="bAgain">もう一回</button></div></div>
<div class="ov" id="ovSet"><div class="panel st"><h2>せってい</h2><div hidden><button id="bBgm"></button><button id="bSnd"></button></div><div class="ck2"><label class="ck"><input type="checkbox" id="cBgmOn">BGM</label><input type="range" id="rBgm" min="0" max="100"></div><div class="ck2"><label class="ck"><input type="checkbox" id="cSeOn">効果音</label><input type="range" id="rSe" min="0" max="100"></div><div class="row">BGMの曲</div><div class="seg" id="sgBgm"></div><div class="row">効果音</div><div class="seg" id="sgSe"></div><div class="row">たまの柄</div><div class="seg" id="sgPt"></div><div class="row">テーマ<span id="thName"></span></div><div class="seg" id="sgTh"></div><div class="row">演出</div><label class="ck"><input type="checkbox" id="cTilt">画面の傾き</label><label class="ck"><input type="checkbox" id="cShock">壁の衝撃波</label><label class="ck"><input type="checkbox" id="cRed">動きを減らす</label><p><button class="big" id="bSetClose">とじる</button></p></div></div><div class="ov" id="ovStages"><div class="panel"><h2>ステージえらび</h2><div id="sTot"></div><div id="grid"></div><p><button id="bClose">とじる</button></p></div></div>
<script>

$("#bBgm").onclick=function(){bgmOn=!bgmOn;$("#bBgm").style.opacity=bgmOn?1:.4;try{localStorage.setItem("cr_bgm",bgmOn?"1":"0")}catch(e){}if(bgmOn)startBgm();else stopBgm()};
$("#bReset").onclick=function(){if(!busy)reset()};
$("#bStages").onclick=openStages;
$("#bClose").onclick=function(){$("#ovStages").classList.remove("on")};
$("#bNext").onclick=function(){$("#ovClear").classList.remove("on");load(Math.min(cur+1,MAXS))};
$("#bSnd").onclick=function(){mute=!mute;$("#bSnd").textContent=mute?"🔇":"🔊";try{localStorage.setItem("cr_mute",mute?"1":"0")}catch(e){}if(!mute)tone(600,900,.1)};
$("#bSnd").textContent=mute?"🔇":"🔊";
addEventListener("resize",function(){if(busy)return;fit();draw();setBallCell(pos)});
var THEMES=[["auto","おまかせ","linear-gradient(135deg,#f1e6cb 50%,#21170f 50%)"],["light","クリーム","#f1e6cb"],["dark","ダーク","#21170f"],["mint","ミント","#d6ecde"],["sakura","さくら","#f8dfe4"],["sky","そら","#d8e9f7"],["lemon","レモン","#f4ecb4"],["grape","ぶどう","#2d2547"],["sunset","ゆうやけ","linear-gradient(135deg,#ffd9a8,#ff8fb0,#b08cff)"],["ocean","うみ","linear-gradient(135deg,#c9f2ff,#6fc3f0,#7a8cff)"],["aurora","オーロラ","linear-gradient(135deg,#10243f,#2a8f93,#6c4fc7)"],["candy","キャンディ","linear-gradient(135deg,#ffc2e2,#d9ccff,#bfe9ff)"],["gold","おうごん","linear-gradient(135deg,#fff4c2,#f3c94b,#b9851a)"],["space","うちゅう","linear-gradient(135deg,#0a0d2a,#4b2fa0)"],["rainbow","レインボー","linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff)"],["snow","ゆき","linear-gradient(135deg,#8fb8ec,#e6f1ff)"]];
function save(){try{localStorage.setItem("cr_set",JSON.stringify(S))}catch(e){}}
var ET="";
function pickTheme(){if(S.theme==="auto"){var L=THEMES.slice(1).map(function(t){return t[0]}).filter(function(x){return x!==ET});ET=L[Math.floor(Math.random()*L.length)]}else ET=S.theme;document.documentElement.setAttribute("data-theme",ET);bgSet(ET);ccD=true}
function applyTheme(){pickTheme();if(lv){var q=applyBall;q();draw()}}
function seg(id,arr,key,cb){var el=$(id);el.innerHTML="";arr.forEach(function(n,i){var b=document.createElement("button");b.textContent=n;b.className=S[key]===i?"on":"";b.onclick=function(){S[key]=i;save();seg(id,arr,key,cb);cb&&cb(i)};el.appendChild(b)})}
function renderSet(){
  $("#rBgm").value=S.bgmVol;$("#rSe").value=S.seVol;
  seg("#sgBgm",["のんびり","わくわく","ほんわか","ジャズ","テクノ","オルゴール","ロック"],"bgm",function(){bgStep=0;if(AC)bgNext=AC.currentTime+.1;if(bgmOn)startBgm()});
  seg("#sgSe",["シュバッ","ぽよん","ピコ","ゴロゴロ","ぽこぽこ","キラキラ","カツカツ","キーボード"],"se",function(){swoosh(8);setTimeout(function(){stopSnd(8)},320)});
  var el=$("#sgTh");el.innerHTML="";THEMES.forEach(function(t){var b=document.createElement("button");b.className="th"+(S.theme===t[0]?" on":"");b.style.background=t[2];b.title=t[1];b.setAttribute("aria-label",t[1]);if(t[3]){b.textContent=t[3];b.style.color=t[4];b.style.fontSize="16px"}b.onclick=function(){S.theme=t[0];save();applyTheme();renderSet()};el.appendChild(b);if(S.theme===t[0])$("#thName").textContent="："+t[1]});
  seg("#sgPt",["なし","しま","みずたま","チェック","うず","ランダム"],"pt",applyBallStyle);
  var cb=$("#cBgmOn");cb.checked=bgmOn;cb.onchange=function(){if(cb.checked!==bgmOn)$("#bBgm").click()};var cq=$("#cSeOn");cq.checked=!mute;cq.onchange=function(){if(cq.checked===mute)$("#bSnd").click()};
  [["cTilt","tilt"],["cShock","shock"],["cRed","reduce"]].forEach(function(p){var c=$("#"+p[0]);c.checked=!!S[p[1]];c.onchange=function(){S[p[1]]=c.checked;save();bgSet(ET);if(!S.tilt||S.reduce){tl.tx=tl.ty=tl.x=tl.y=tl.vx=tl.vy=0;tlApply();ballI.style.transform=""}}});
}
$("#rBgm").oninput=function(){S.bgmVol=+this.value;if(bgG)bgG.gain.value=S.bgmVol/70;save()};
$("#rSe").oninput=function(){S.seVol=+this.value;if(seG)seG.gain.value=S.seVol/100;save()};
$("#rSe").onchange=function(){stopSnd(3)};
$("#bSet").onclick=function(){renderSet();$("#ovSet").classList.add("on")};
$("#bSetClose").onclick=function(){$("#ovSet").classList.remove("on")};
var TP={mint:["#12b76a","#0ea5a4","#34c38f"],sakura:["#ff6f9f","#f0508a","#ff8fb1"],sky:["#2f80ff","#4aa3ff","#1d6fd8"],lemon:["#f5a800","#ff9f1c","#e0b000"]},TG={space:["#8b5cf6","#ffd23f"],snow:["#38bdf8","#6366f1"],gold:["#d62828","#7a0c2e"],rainbow:["#ff4d6d","#ff9f1c","#ffd93d","#12b76a","#2f80ff","#8b5cf6"],sunset:["#ff8a3d","#ff3d8b"],ocean:["#00b4d8","#3a6cff"],aurora:["#5cffc8","#7a8cff"],candy:["#ff7ac8","#7a9cff"]};
function ballCol(s){var p=TP[ET];return p?p[(s-1)%p.length]:(TG[ET]?TG[ET][0]:COLORS[(s-1)%COLORS.length])}
function applyBall(){var r=document.documentElement.style,g=TG[ET];if(g)r.setProperty("--ballbg","linear-gradient(135deg,"+g.join(",")+")");else r.removeProperty("--ballbg");r.setProperty("--ball",ballCol(cur));ccD=true}
var PTc=0;function applyBallStyle(){var p=S.pt;if(p===5){var Ls=[1,2,3,4].filter(function(x){return x!==PTc});p=Ls[Math.floor(Math.random()*Ls.length)]}PTc=p;ballEl.setAttribute("data-sh",0);ballEl.setAttribute("data-pt",p)}
var cc,ccD=true;function CS(){if(ccD){var s=getComputedStyle(document.documentElement);cc={tile:s.getPropertyValue("--tile"),cookie:s.getPropertyValue("--cookie"),ball:s.getPropertyValue("--ball"),grid:s.getPropertyValue("--grid")};ccD=false}return cc}
applyBallStyle();applyTheme();load(maxStage);
})();
</script>
